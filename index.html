
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FC Online 3D - PC</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #17351f;
      font-family: Arial, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute;
      z-index: 5;
      top: 12px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      flex-wrap: wrap;
      padding: 0 8px;
    }
    #logo {
      font-size: 24px;
      font-weight: 900;
      color: white;
      font-style: italic;
      text-shadow: 0 2px 6px #000;
    }
    #logo span { color: #61e7a4; }
    #score {
      padding: 12px 20px;
      background: #101923eF;
      color: white;
      border: 1px solid #ffffff35;
      border-radius: 8px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    #status {
      color: white;
      background: #101923d9;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    #controls {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 96%;
      color: white;
      background: #101923e8;
      padding: 10px 14px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
      pointer-events: none;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      font-weight: bold;
      background: #17351f;
      z-index: 10;
    }
    @media (max-width: 600px) {
      #status { display: none; }
      #score { padding: 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="loading">ĐANG TẢI FC 3D...</div>

  <div id="hud">
    <div id="logo">FC <span>3D</span></div>
    <div id="score">XANH 0 - 0 ĐỎ</div>
    <div id="status">Trận đấu sẵn sàng</div>
  </div>

  <div id="controls">
    <b>W A S D</b>: Di chuyển &nbsp; | &nbsp;
    <b>SPACE</b>: Sút &nbsp; | &nbsp;
    <b>R</b>: Đưa bóng về giữa sân
  </div>

  <!-- GAME_JS -->
<script src="game.js"></script>
</body>
</html>
